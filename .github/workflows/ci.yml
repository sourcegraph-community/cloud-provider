name: ci

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      # Vet and test only the packages a PR touches. Push runs build only, as a baseline.
      # Integration and e2e tests need etcd and a cluster, so they are skipped.
      - name: Changed packages
        id: pkgs
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          pkgs=$(git diff --name-only "$BASE"...HEAD -- '*.go' | xargs -r -n1 dirname | sort -u |
            grep -v -E '(^|/)test/(integration|e2e)' |
            while read -r d; do [[ -d "$d" ]] && echo "./$d"; done | tr '\n' ' ')
          echo "list=$pkgs" >> "$GITHUB_OUTPUT"
          echo "packages: ${pkgs:-none}"

      # copylocks, structtag, and lostcancel already fail upstream in these packages.
      - name: Vet
        if: steps.pkgs.outputs.list != ''
        run: go vet -copylocks=false -structtag=false -lostcancel=false ${{ steps.pkgs.outputs.list }}

      - name: Test
        if: steps.pkgs.outputs.list != ''
        run: go test -timeout 15m ${{ steps.pkgs.outputs.list }}
