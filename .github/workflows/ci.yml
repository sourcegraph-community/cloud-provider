name: ci

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # On PRs, test only the packages the changeset touched. On push, test everything
      # once so you know the baseline is green before running the batch change.
      - name: Test
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT" == pull_request ]]; then
            pkgs=$(git diff --name-only "$BASE"...HEAD -- '*.go' | xargs -r -n1 dirname | sort -u |
              while read -r d; do [[ -d "$d" ]] && echo "./$d"; done)
          else
            pkgs=./...
          fi
          if [[ -z "$pkgs" ]]; then
            echo "no Go packages changed"
            exit 0
          fi
          go test $pkgs
